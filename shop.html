<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Work+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Shop | Triangle Works</title>
  </head>
  <body data-page="shop">
    <header id="site-header"></header>
    <main>
      <h2>Shop frames</h2>
      <div class="tools">
        <input
          id="search"
          type="search"
          placeholder="Search frames"
          aria-label="Search"
        />
        <select id="type" aria-label="Type">
          <option value="">All types</option>
          <option>Aero</option>
          <option>All-Round</option>
          <option>Climbing</option>
        </select>
        <select id="material" aria-label="Material">
          <option value="">All materials</option>
          <option>Carbon</option>
        </select>
        <select id="size" aria-label="Size">
          <option value="">All sizes</option>
          <option>XS</option>
          <option>S</option>
          <option>M</option>
          <option>L</option>
          <option>XL</option>
        </select>
        <select id="sort" aria-label="Sort">
          <option value="">Sort: default</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
        </select>
      </div>
      <p id="count"></p>
      <div class="grid" id="results"></div>
    </main>
    <footer id="site-footer"></footer>
    <script src="script.js"></script>
  </body>
</html>
