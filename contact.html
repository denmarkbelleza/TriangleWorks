<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Work+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Contact | Triangle Works</title>
  </head>
  <body data-page="contact">
    <header id="site-header"></header>
    <main>
      <h2>Ask about a frame</h2>
      <form id="contact-form" novalidate>
        <label for="name">Name</label>
        <input id="name" />
        <div class="err" id="name-err"></div>
        <label for="email">Email</label>
        <input id="email" type="email" />
        <div class="err" id="email-err"></div>
        <label for="topic">Topic</label>
        <select id="topic">
          <option>Sizing help</option>
          <option>Order question</option>
          <option>Custom frame</option>
        </select>
        <label for="message">Message</label>
        <textarea id="message" rows="5"></textarea>
        <div class="err" id="message-err"></div>
        <button class="btn" type="submit">Send message</button>
      </form>
      <div id="sent"></div>
    </main>
    <footer id="site-footer"></footer>
    <script src="script.js"></script>
  </body>
</html>
